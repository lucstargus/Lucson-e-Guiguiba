<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto jQuery Plugins</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .carousel {
      width: 80%;
      margin: auto;
    }
    .carousel img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    form {
      margin-top: 40px;
      max-width: 400px;
    }
    input, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .error {
      color: red;
      font-size: 0.9em;
      margin-top: -10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>Exercício jQuery Plugins</h1>

  <div class="carousel">
    <div><img src="https://via.placeholder.com/800x300?text=Slide+1" alt="Slide 1"></div>
    <div><img src="https://via.placeholder.com/800x300?text=Slide+2" alt="Slide 2"></div>
    <div><img src="https://via.placeholder.com/800x300?text=Slide+3" alt="Slide 3"></div>
  </div>

  <form id="formulario">
    <input type="text" name="nome" placeholder="Nome completo" required>
    <input type="text" name="data" placeholder="Data de nascimento" required>
    <input type="text" name="telefone" placeholder="Telefone" required>
    <button type="submit">Enviar</button>
  </form>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
  <script>
    $(document).ready(function(){
      // Inicializa o carousel
      $('.carousel').slick({
        autoplay: true,
        dots: true,
        arrows: true
      });

      // Máscaras
      $('input[name="data"]').mask('00/00/0000');
      $('input[name="telefone"]').mask('(00) 00000-0000');

      // Validação
      $('#formulario').validate({
        rules: {
          nome: {
            required: true,
            minlength: 3
          },
          data: {
            required: true
          },
          telefone: {
            required: true
          }
        },
        messages: {
          nome: "Por favor, informe seu nome",
          data: "Informe uma data válida",
          telefone: "Informe um número de telefone válido"
        }
      });
    });
  </script>
</body>
</html>
